name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target_env:
        type: choice
        options: [staging, prod]
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest
      - run: |
          mkdir -p ../artifacts
          pip install -t package .
          cp -r app package/
          cd package
          zip -r ../../artifacts/backend.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: backend-zip
          path: artifacts/backend.zip
          retention-days: 1

  terraform-plan:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-zip
          path: artifacts
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra plan -var-file=environments/dev.tfvars

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [terraform-plan]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-zip
          path: artifacts
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init
      - run: terraform -chdir=infra apply -auto-approve -var-file=environments/dev.tfvars
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: frontend
      - run: |
          API_URL=$(terraform -chdir=infra output -raw api_url)
          CLOUDFRONT_DOMAIN=$(terraform -chdir=infra output -raw cloudfront_domain)
          COGNITO_DOMAIN=$(terraform -chdir=infra output -raw cognito_domain)
          COGNITO_CLIENT_ID=$(terraform -chdir=infra output -raw cognito_client_id)
          COGNITO_API_SCOPES=$(terraform -chdir=infra output -raw cognito_api_scopes)
          {
            echo "VITE_API_BASE_URL=$API_URL"
            echo "VITE_DEMO_MODE=false"
            echo "VITE_COGNITO_DOMAIN=$COGNITO_DOMAIN"
            echo "VITE_COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID"
            echo "VITE_COGNITO_API_SCOPES=$COGNITO_API_SCOPES"
            echo "VITE_COGNITO_REDIRECT_URI=https://$CLOUDFRONT_DOMAIN/"
            echo "VITE_COGNITO_LOGOUT_URI=https://$CLOUDFRONT_DOMAIN/"
          } >> "$GITHUB_ENV"
      - run: npm run build
        working-directory: frontend
      - run: |
          FRONTEND_BUCKET=$(terraform -chdir=infra output -raw frontend_bucket_name)
          aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
          aws s3 cp frontend/dist/index.html "s3://$FRONTEND_BUCKET/index.html" --cache-control "public,max-age=60"
      - run: |
          DISTRIBUTION_ID=$(terraform -chdir=infra output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/assets/*"
      - run: |
          API_URL=$(terraform -chdir=infra output -raw api_url)
          curl -f "$API_URL/health"

  deploy-controlled:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    environment: ${{ github.event.inputs.target_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-zip
          path: artifacts
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event.inputs.target_env == 'prod' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init
      - run: terraform -chdir=infra apply -auto-approve -var-file=environments/${{ github.event.inputs.target_env }}.tfvars
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: frontend
      - run: |
          API_URL=$(terraform -chdir=infra output -raw api_url)
          CLOUDFRONT_DOMAIN=$(terraform -chdir=infra output -raw cloudfront_domain)
          COGNITO_DOMAIN=$(terraform -chdir=infra output -raw cognito_domain)
          COGNITO_CLIENT_ID=$(terraform -chdir=infra output -raw cognito_client_id)
          COGNITO_API_SCOPES=$(terraform -chdir=infra output -raw cognito_api_scopes)
          {
            echo "VITE_API_BASE_URL=$API_URL"
            echo "VITE_DEMO_MODE=false"
            echo "VITE_COGNITO_DOMAIN=$COGNITO_DOMAIN"
            echo "VITE_COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID"
            echo "VITE_COGNITO_API_SCOPES=$COGNITO_API_SCOPES"
            echo "VITE_COGNITO_REDIRECT_URI=https://$CLOUDFRONT_DOMAIN/"
            echo "VITE_COGNITO_LOGOUT_URI=https://$CLOUDFRONT_DOMAIN/"
          } >> "$GITHUB_ENV"
      - run: npm run build
        working-directory: frontend
      - run: |
          FRONTEND_BUCKET=$(terraform -chdir=infra output -raw frontend_bucket_name)
          aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
          aws s3 cp frontend/dist/index.html "s3://$FRONTEND_BUCKET/index.html" --cache-control "public,max-age=60"
      - run: |
          DISTRIBUTION_ID=$(terraform -chdir=infra output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/assets/*"
      - run: |
          API_URL=$(terraform -chdir=infra output -raw api_url)
          curl -f "$API_URL/health"
